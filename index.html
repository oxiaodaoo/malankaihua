<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清新儒雅的网络博客</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f4f8fb;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #6fa3f7;
            color: white;
            padding: 30px 20px;
            text-align: center;
            font-size: 1.5rem;
        }
        .container {
            width: 90%;
            margin: 0 auto;
            padding: 30px 0;
        }
        .blog-posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .blog-post {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .blog-post:hover {
            transform: translateY(-10px);
        }
        .blog-post h2 {
            font-size: 1.8rem;
            color: #6fa3f7;
            margin-bottom: 15px;
        }
        .blog-post p {
            font-size: 1rem;
            color: #555;
            line-height: 1.6;
        }
        footer {
            background-color: #6fa3f7;
            color: white;
            text-align: center;
            padding: 20px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        .btn {
            background-color: #6fa3f7;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1rem;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #4e88d1;
        }
    </style>
</head>
<body>
    <header>
        <h1>清新儒雅的网络博客</h1>
        <p>欢迎来到我的博客，分享生活与思想的点滴</p>
    </header>
    
    <div class="container">
        <section class="blog-posts">
            <article class="blog-post">
                <h2>第一篇文章标题</h2>
                <p>这里是文章的简介部分，简单介绍一下文章的内容。你可以在这里写一些引人入胜的内容，吸引读者点击阅读。</p>
                <a href="#" class="btn">继续阅读</a>
            </article>

            <article class="blog-post">
                <h2>第二篇文章标题</h2>
                <p>这是另一篇文章的简介，文字简洁但能够传递出文章的精髓，让读者感到有兴趣阅读全文。</p>
                <a href="#" class="btn">继续阅读</a>
            </article>

            <article class="blog-post">
                <h2>第三篇文章标题</h2>
                <p>此处是第三篇文章的简要介绍，文字风格清新，适合喜欢安静阅读的朋友。</p>
                <a href="#" class="btn">继续阅读</a>
            </article>
        </section>
    </div>

    <footer>
        <p>&copy; 2025 清新儒雅网络博客 | 设计与开发</p>
    </footer>
</body>
</html>
